<style>
/* 히어로 컨테이너 */
.hero {
	position: relative;
	overflow: hidden;
	background-color: {{property.bgColor}};
	min-height: {{property.minHeightMobile}}px;
	display: flex;
	align-items: center;
	padding: {{property.padding.mobile.top}}px {{property.padding.mobile.right}}px {{property.padding.mobile.bottom}}px {{property.padding.mobile.left}}px;
{{#if property.useBackgroundImage}}
	background-image: url('{{property.backgroundImage}}');
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
{{/if}}
}

@media (min-width: 768px) {
	.hero {
		min-height: {{property.minHeightDesktop}}px;
		padding: {{property.padding.desktop.top}}px {{property.padding.desktop.right}}px {{property.padding.desktop.bottom}}px {{property.padding.desktop.left}}px;
	}
}

/* 배경 이미지 위 어둡게 덮는 레이어 */
.hero-overlay {
	position: absolute;
	inset: 0;
	background-color: {{property.bgColor}};
	opacity: calc({{property.overlayOpacity}} / 100);
}

.hero-inner {
	position: relative;
	z-index: 1;
	width: 100%;
	display: flex;
	flex-direction: column;
	text-align: {{property.align}};
	align-items: {{#if (eq property.align "center")}}center{{else}}flex-start{{/if}};
}

/* 상단 지역 뱃지 */
.hero-badge {
	font-family: var(--font-family-body);
	font-weight: var(--font-weight-body);
	font-size: 13px;
	letter-spacing: 0.08em;
	color: {{property.accentColor}};
	border: 1px solid {{property.accentColor}};
	padding: 6px 12px;
	margin-bottom: 20px;
	display: inline-block;
}

/* 제목 */
.hero-title {
	font-family: var(--font-family-heading);
	font-weight: var(--font-weight-heading);
	color: {{property.textColor}};
	font-size: {{property.titleSizeMobile}}px;
	line-height: 1.3;
	letter-spacing: -0.02em;
	white-space: pre-line;
	margin: 0;
}

/* 설명 */
.hero-desc {
	font-family: var(--font-family-body);
	font-weight: var(--font-weight-body);
	color: {{property.textColor}};
	opacity: 0.85;
	font-size: {{property.descSizeMobile}}px;
	line-height: 1.6;
	white-space: pre-line;
	margin: 16px 0 0 0;
}

@media (min-width: 768px) {
	.hero-title { font-size: {{property.titleSizeDesktop}}px; }
	.hero-desc { font-size: {{property.descSizeDesktop}}px; margin-top: 20px; }
}

/* 버튼 영역 */
.hero-actions {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	margin-top: 28px;
}

.hero-btn {
	font-family: var(--font-family-body);
	font-weight: var(--font-weight-body);
	font-size: 15px;
	line-height: 1;
	padding: 15px 26px;
	text-decoration: none;
	display: inline-block;
	cursor: pointer;
}

.hero-btn.primary {
	background-color: {{property.accentColor}};
	color: {{property.bgColor}};
}

.hero-btn.ghost {
	background-color: transparent;
	color: {{property.textColor}};
	border: 1px solid {{property.textColor}};
}
</style>

<template>
	<div class="hero">
		{{#if property.useBackgroundImage}}
			<div class="hero-overlay"></div>
		{{/if}}

		<div class="hero-inner">
			{{#if property.badge}}
				<span class="hero-badge">{{property.badge}}</span>
			{{/if}}

			<h1 class="hero-title">{{property.title}}</h1>

			{{#if property.description}}
				<p class="hero-desc">{{property.description}}</p>
			{{/if}}

			<div class="hero-actions">
				{{#if property.primaryButtonText}}
					<a class="hero-btn primary" href="{{property.primaryButtonLink.value}}">{{property.primaryButtonText}}</a>
				{{/if}}
				{{#if property.secondaryButtonText}}
					<a class="hero-btn ghost" href="{{property.secondaryButtonLink.value}}">{{property.secondaryButtonText}}</a>
				{{/if}}
			</div>
		</div>
	</div>
</template>
