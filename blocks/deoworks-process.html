<style>
.prc{padding:{{property.padTop}}px {{property.padRight}}px {{property.padBottom}}px {{property.padLeft}}px;background-color:{{property.bgColor}};box-sizing:border-box}
.prc-head{max-width:720px;margin-bottom:{{property.headGap}}px}
.prc-eyebrow{font-family:var(--font-family-body);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:{{property.accentColor}};margin:0 0 10px}
.prc-title{font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:{{property.titleSize}}px;line-height:1.25;letter-spacing:-0.02em;color:{{property.titleColor}};margin:0 0 12px}
.prc-desc{font-family:var(--font-family-body);font-weight:var(--font-weight-body);font-size:{{property.descSize}}px;line-height:1.7;color:{{property.bodyColor}};margin:0;white-space:pre-line}
.prc-grid{display:grid;grid-template-columns:repeat({{property.columns}},1fr);gap:{{property.cardGap}}px}
.prc-card{background-color:{{property.cardBgColor}};border:1px solid {{property.borderColor}};border-radius:{{property.cardRadius}}px;overflow:hidden;display:flex;flex-direction:column}
.prc-media{position:relative;width:100%;aspect-ratio:4 / 3;background-color:{{property.mediaBgColor}};overflow:hidden}
.prc-media img{width:100%;height:100%;object-fit:cover;display:block}
.prc-media svg{width:100%;height:100%;display:block}
.prc-body{padding:{{property.cardPad}}px}
.prc-no{font-family:var(--font-family-body);font-weight:700;font-size:13px;letter-spacing:.08em;color:{{property.accentColor}};margin:0 0 6px}
.prc-card h3{font-family:var(--font-family-heading);font-weight:var(--font-weight-heading);font-size:{{property.cardTitleSize}}px;line-height:1.35;color:{{property.titleColor}};margin:0 0 8px}
.prc-card p{font-family:var(--font-family-body);font-weight:var(--font-weight-body);font-size:{{property.cardDescSize}}px;line-height:1.65;color:{{property.bodyColor}};margin:0}
@media (max-width:1024px) and (min-width:768px){.prc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:767px){.prc{padding:{{property.padTopM}}px {{property.padRightM}}px {{property.padBottomM}}px {{property.padLeftM}}px}.prc-grid{grid-template-columns:repeat({{property.columnsM}},1fr)}.prc-title{font-size:{{property.titleSizeM}}px}.prc-head{margin-bottom:{{property.headGapM}}px}}
</style>
<template>
<section class='prc'>
<div class='prc-head'>
{{#if property.eyebrow}}<p class='prc-eyebrow'>{{property.eyebrow}}</p>{{/if}}
<h2 class='prc-title'>{{property.title}}</h2>
{{#if property.desc}}<p class='prc-desc'>{{property.desc}}</p>{{/if}}
</div>
<div class='prc-grid'>
{{#each property.items}}
<div class='prc-card'>
<div class='prc-media'>
{{#if image}}
<img src='{{image}}' alt='{{title}}'>
{{else}}
{{#if (eq icon 'survey')}}
<svg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='{{../property.accentColor}}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
<path d='M0 215 H400' opacity='.35'/>
<path d='M200 120 L172 215 M200 120 L228 215 M200 120 L200 212'/>
<path d='M186 118 H214 V104 H186 Z'/>
<path d='M214 111 H300' opacity='.7'/>
<path d='M330 150 V215 M330 165 H344 M330 182 H344 M330 199 H344' opacity='.6'/>
<path d='M30 100 H150 M30 118 H150' opacity='.5'/>
</svg>
{{/if}}
{{#if (eq icon 'estimate')}}
<svg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='{{../property.accentColor}}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
<path d='M150 70 H252 L282 100 V230 H150 Z'/>
<path d='M252 70 V100 H282' opacity='.6'/>
<path d='M170 128 H262 M170 148 H262 M170 168 H240' opacity='.55'/>
<circle cx='250' cy='205' r='20'/>
<path d='M240 205 l7 7 l14 -16'/>
<path d='M300 120 L344 164' opacity='.4'/>
</svg>
{{/if}}
{{#if (eq icon 'build')}}
<svg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='{{../property.accentColor}}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
<path d='M0 205 H140 L175 250 H255 L290 205 H400' opacity='.35'/>
<path d='M40 205 V150 H105 V205'/>
<path d='M105 172 L165 140 L215 190 L245 230 L212 240 L192 212'/>
<path d='M175 250 H255 V232 H175 Z'/>
<circle cx='215' cy='241' r='9'/>
<path d='M30 118 H160 M30 100 H160' opacity='.5'/>
<path d='M300 205 V168 H360 V205' opacity='.5'/>
</svg>
{{/if}}
{{#if (eq icon 'complete')}}
<svg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='{{../property.accentColor}}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
<path d='M0 250 H400' opacity='.35'/>
<path d='M120 250 V130 H250 V250'/>
<path d='M120 165 H250 M120 200 H250' opacity='.4'/>
<path d='M170 250 V205 H205 V250'/>
<path d='M250 130 V100 M250 102 H286 L276 111 L286 120 H250'/>
<circle cx='312' cy='172' r='22'/>
<path d='M301 172 l8 8 l16 -18'/>
</svg>
{{/if}}
{{/if}}
</div>
<div class='prc-body'>
<div class='prc-no'>STEP 0{{add @index 1}}</div>
<h3>{{title}}</h3>
{{#if desc}}<p>{{desc}}</p>{{/if}}
</div>
</div>
{{/each}}
</div>
</section>
</template>
