<style>
.dww{background:{{property.bg}};padding:{{property.padTop}}px 24px {{property.padBottom}}px;font-family:'Pretendard',var(--font-family-body),-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
.dww-in{max-width:1120px;margin:0 auto}
.dww-head{max-width:760px;margin-bottom:44px}
.dww-eyebrow{font-weight:800;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:{{property.accent}};margin:0 0 12px}
.dww-title{color:{{property.textColor}};font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.25;letter-spacing:-.02em;margin:0 0 12px}
.dww-sub{color:{{property.subColor}};font-size:clamp(15px,1.7vw,17px);line-height:1.7;margin:0}
.dww-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:8px 0 56px;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
.dww-stat{padding:34px 22px;position:relative}
.dww-stat:not(:first-child)::before{content:'';position:absolute;left:0;top:28px;bottom:28px;width:1px;background:rgba(255,255,255,.14)}
.dww-stat b{display:block;font-size:clamp(30px,4.4vw,46px);font-weight:900;color:{{property.accent}};line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dww-stat span{display:block;margin-top:10px;color:{{property.textColor}};font-weight:700;font-size:15px}
.dww-stat em{display:block;margin-top:2px;color:{{property.subColor}};font-style:normal;font-size:13px;opacity:.85}
.dww-points{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.dww-pt{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-top:3px solid {{property.accent}};border-radius:12px;padding:28px 24px}
.dww-pt .ic{width:42px;height:42px;margin-bottom:14px}
.dww-pt .ic svg{width:42px;height:42px;stroke:{{property.accent}};fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dww-pt h3{color:{{property.textColor}};font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em}
.dww-pt p{color:{{property.subColor}};font-size:14.5px;line-height:1.65;margin:0}
@media(max-width:820px){.dww-stats{grid-template-columns:1fr 1fr}.dww-stat:nth-child(3)::before{display:none}.dww-points{grid-template-columns:1fr}}
@media(max-width:480px){.dww{padding:60px 20px}.dww-stats{grid-template-columns:1fr}.dww-stat:not(:first-child)::before{display:none}.dww-stat:not(:first-child){border-top:1px solid rgba(255,255,255,.14)}}
</style>
<template>
<section class='dww'>
<div class='dww-in'>
<div class='dww-head'>
{{#if property.eyebrow}}<p class='dww-eyebrow'>{{property.eyebrow}}</p>{{/if}}
<h2 class='dww-title'>{{property.title}}</h2>
{{#if property.sub}}<p class='dww-sub'>{{property.sub}}</p>{{/if}}
</div>
<div class='dww-stats'>
{{#each property.stats}}
<div class='dww-stat'><b>{{value}}</b><span>{{label}}</span>{{#if note}}<em>{{note}}</em>{{/if}}</div>
{{/each}}
</div>
<div class='dww-points'>
{{#each property.points}}
<div class='dww-pt'>
<div class='ic'>
{{#if (eq icon 'shield')}}<svg viewBox='0 0 42 42'><path d='M21 4l14 5v9c0 9-6 15-14 20C13 33 7 27 7 18V9z'/><path d='M15 21l4 4 8-9'/></svg>{{/if}}
{{#if (eq icon 'doc')}}<svg viewBox='0 0 42 42'><path d='M9 6h18l6 6v24H9z'/><path d='M27 6v6h6'/><path d='M14 20h14M14 26h10'/></svg>{{/if}}
{{#if (eq icon 'build')}}<svg viewBox='0 0 42 42'><path d='M6 34h30'/><path d='M11 34V20h8v14'/><path d='M23 34V14h8v20'/><path d='M27 9l3 3 5-6'/></svg>{{/if}}
</div>
<h3>{{title}}</h3>
{{#if desc}}<p>{{desc}}</p>{{/if}}
</div>
{{/each}}
</div>
</div>
</section>
</template>
