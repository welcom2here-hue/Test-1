<title>현장 기록</title>
<!--
================================================================================
 건설 현장 기록 웹앱 (단일 HTML 파일)
================================================================================
 사용 대상 : 토목 현장 책임자 (50~60대), 장갑 낀 손, 폰으로 현장에서 사용
 배포 방법 : 이 파일을 웹에 올리고, 현장마다 다른 링크(?s=토큰)를 카톡으로 전달
 로그인    : 없음. 링크가 곧 현장 구분.

 --------------------------------------------------------------------------------
 [ 링크(URL) 구조 ]
 --------------------------------------------------------------------------------
   작업자 화면 : https://내주소/index.html?s=<현장토큰>
                 예) ?s=k7x2a9   ->  A현장
                 현장마다 토큰이 다르며, CONFIG.SITE_LINKS 에서 관리한다.
   관리자 화면 : https://내주소/index.html?admin=<긴랜덤문자열>
                 CONFIG.ADMIN_TOKEN 값과 일치해야 열린다.
                 ?admin=1 처럼 추측 가능한 형태가 아니라 긴 문자열이라
                 남이 우연히 들어올 확률은 낮다. 다만 이것은 "자물쇠"가 아니라
                 "안 보이는 문" 수준이다.

 [ 실제 운영 때 관리자 화면을 제대로 막는 방법 (지금은 미구현) ]
   1) 서버를 붙인 뒤 관리자 페이지를 서버 로그인(아이디/비번) 뒤에 둔다.
   2) 또는 웹서버(Nginx 등) Basic Auth 로 /admin 경로를 잠근다.
   3) 관리자 링크는 카톡·문자로 뿌리지 말고 관리자 본인에게만 직접 전달한다.
   * 지금 구조(브라우저 저장)에서는 링크를 아는 사람은 누구나 볼 수 있으니
     민감정보(주민번호 등)는 절대 입력하지 말 것.

 --------------------------------------------------------------------------------
 [ 저장 구조 요약 ]
 --------------------------------------------------------------------------------
   - 텍스트/기록 : localStorage  (현장+날짜 = dayRecord 한 덩어리)
   - 사진 원본   : IndexedDB (1200px 로 줄여서 저장)
   - 썸네일      : dayRecord 안에 작게(약 160px) 넣어둠 -> 목록이 빨라짐
   - 읽고 쓰는 모든 동작은 Store.* 함수로만 처리한다.

 --------------------------------------------------------------------------------
 [ 나중에 서버를 붙일 때 바꿔야 하는 곳 (여기만 고치면 됨) ]
 --------------------------------------------------------------------------------
   * 화면 코드(render*, 이벤트)는 손대지 않는다.
   * 아래 Store 객체의 내부만 fetch()로 교체하면 된다:

     Store.loadDay(site, date)      -> GET  /api/day?site=..&date=..
     Store.saveDay(record)          -> POST /api/day
     Store.listDates(site)          -> GET  /api/days?site=..
     Store.savePhoto(id, blob)      -> POST /api/photo (multipart)
     Store.loadPhoto(id)            -> GET  /api/photo/:id
     Store.loadVehicles/saveVehicle -> /api/vehicles
     Store.loadProcesses/addProcess -> /api/processes
     Store.loadNames/addName        -> /api/names

   * 함수들은 이미 전부 async (Promise 반환)로 설계되어 있어
     내부만 네트워크 호출로 바꿔도 화면 쪽은 그대로 동작한다.
   * 관리자 실시간 조회 : saveDay 후 서버가 저장하면, 관리자 화면에서
     주기적으로(polling) 또는 웹소켓으로 loadDay 를 다시 부르면 된다.
================================================================================
-->

<!-- ========================================================================
     STORE : 저장/불러오기. 서버 붙일 땐 이 안쪽만 교체하면 됨. (전부 async)
     ======================================================================== -->
<script>
const Store = (function(){
  const LS = window.localStorage;
  const K = {
    day:  (site,date)=>`day:${site}:${date}`,
    dayIndex: (site)=>`dayindex:${site}`,   // 그 현장의 날짜 목록
    vehicles: "vehicles",                   // 차량번호 -> {company, driver}
    processes:"processes_extra",            // 사용자가 추가한 공정
    names:    "worker_names",               // 인력 이름 자동완성
    tools:    "tools_extra",                // 사용자가 추가한 공구
    materials:"material_names",             // 구입 자재 이름 자동완성
  };

  // ---- IndexedDB (사진 원본 전용) ----
  let _db=null;
  function idb(){
    if(_db) return Promise.resolve(_db);
    return new Promise((res,rej)=>{
      const r = indexedDB.open("site-photos", 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("photos"); };
      r.onsuccess = ()=>{ _db=r.result; res(_db); };
      r.onerror   = ()=> rej(r.error);
    });
  }
  async function idbPut(id, blob){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction("photos","readwrite");
      tx.objectStore("photos").put(blob, id);
      tx.oncomplete=()=>res(true);
      tx.onerror=()=>rej(tx.error);
    });
  }
  async function idbGet(id){
    const db = await idb();
    return new Promise((res,rej)=>{
      const tx = db.transaction("photos","readonly");
      const g = tx.objectStore("photos").get(id);
      g.onsuccess=()=>res(g.result||null);
      g.onerror=()=>rej(g.error);
    });
  }

  function jget(key, def){ try{ const v=LS.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function jset(key, val){
    try{ LS.setItem(key, JSON.stringify(val)); return true; }
    catch(e){
      // 저장 공간이 찼을 때
      if(e && (e.name==="QuotaExceededError" || e.code===22)){ return false; }
      console.warn("localStorage 저장 실패", e); return false;
    }
  }

  return {
    // ---- 하루 기록 ----
    async loadDay(site, date){
      return jget(K.day(site,date), null);
    },
    async saveDay(rec){
      const ok = jset(K.day(rec.site, rec.date), rec);
      if(ok){
        const idx = jget(K.dayIndex(rec.site), []);
        if(!idx.includes(rec.date)){ idx.push(rec.date); idx.sort().reverse(); jset(K.dayIndex(rec.site), idx); }
      }
      return ok; // false 면 공간 부족
    },
    async listDates(site){
      return jget(K.dayIndex(site), []);
    },

    // ---- 사진 ----
    // meta 는 dayRecord 안에 저장(썸네일 포함), 원본 blob 은 IndexedDB.
    async savePhoto(id, blob){
      try{ await idbPut(id, blob); return true; }
      catch(e){ console.warn("사진 저장 실패", e); return false; }
    },
    async loadPhoto(id){
      try{ return await idbGet(id); }catch(e){ return null; }
    },
    async deletePhoto(id){
      try{
        const db = await idb();
        return new Promise((res)=>{
          const tx = db.transaction("photos","readwrite");
          tx.objectStore("photos").delete(id);
          tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
        });
      }catch(e){ return false; }
    },

    // ---- 차량 목록 (번호 -> 업체/기사) ----
    async loadVehicles(){ return jget(K.vehicles, {}); },
    async saveVehicle(carNo, company, driver){
      if(!carNo) return;
      const v = jget(K.vehicles, {});
      v[carNo] = Object.assign({}, v[carNo], {
        company: company || (v[carNo]&&v[carNo].company) || "",
        driver:  driver  || (v[carNo]&&v[carNo].driver)  || "",
      });
      jset(K.vehicles, v);
    },

    // ---- 공정 이름 누적 ----
    async loadProcesses(){
      return CONFIG.PROCESSES.concat(jget(K.processes, []));
    },
    async addProcess(name){
      if(!name) return;
      const all = CONFIG.PROCESSES.concat(jget(K.processes, []));
      if(all.includes(name)) return;
      const extra = jget(K.processes, []); extra.push(name); jset(K.processes, extra);
    },

    // ---- 인력 이름 자동완성 ----
    async loadNames(){ return jget(K.names, []); },
    async addName(name){
      if(!name) return;
      const arr = jget(K.names, []);
      if(!arr.includes(name)){ arr.push(name); jset(K.names, arr); }
    },

    // ---- 공구 목록 누적 (기본 + 사용자 추가) ----
    async loadTools(){
      return CONFIG.TOOLS.concat(jget(K.tools, []));
    },
    async addTool(name){
      if(!name) return;
      const all = CONFIG.TOOLS.concat(jget(K.tools, []));
      if(all.includes(name)) return;
      const extra = jget(K.tools, []); extra.push(name); jset(K.tools, extra);
    },

    // ---- 구입 자재 이름 자동완성 ----
    async loadMaterials(){ return jget(K.materials, []); },
    async addMaterial(name){
      if(!name) return;
      const arr = jget(K.materials, []);
      if(!arr.includes(name)){ arr.push(name); jset(K.materials, arr); }
    },
  };
})();
</script>

<!-- ========================================================================
     사진 종류 분류 함수 (지금은 사람이 버튼으로 고른 값 그대로 사용)
       나중에 자동분류(OCR/AI)로 바꿀 때 이 함수 하나만 교체하면 됨.
     ======================================================================== -->
<script>
async function classifyPhoto(selectedType, ctx){
  // ctx = { blob, dataURL } 등 나중에 자동분류에 필요할 정보 자리
  return selectedType || "기타";
}
</script>

<!-- ========================================================================
     이미지 축소 유틸 (원본 1200px, 썸네일 160px)
     ======================================================================== -->
<script>
function fileToImage(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function drawScaled(img, maxPx, quality){
  let {width:w, height:h} = img;
  const scale = Math.min(1, maxPx/Math.max(w,h));
  w = Math.round(w*scale); h = Math.round(h*scale);
  const c = document.createElement("canvas");
  c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c;
}
function canvasToBlob(canvas, quality){
  return new Promise((res)=> canvas.toBlob(b=>res(b), "image/jpeg", quality));
}
// 원본 blob + 썸네일 dataURL 반환
async function processPhoto(file){
  const img = await fileToImage(file);
  const big = drawScaled(img, CONFIG.PHOTO_MAX_PX, 0.7);
  const blob = await canvasToBlob(big, 0.7);
  const th  = drawScaled(img, CONFIG.THUMB_MAX_PX, 0.6);
  const thumb = th.toDataURL("image/jpeg", 0.55);
  return { blob, thumb };
}
</script>

<!-- ========================================================================
     화면(UI) 코드 — Store.* 만 사용. 서버 붙여도 여기는 안 고침.
     ======================================================================== -->
<div id="app"></div>

<script>
// ---------- 공통 상태 ----------
const APP = {
  mode: "worker",        // "worker" | "admin"
  siteId: null,          // 현장 토큰
  siteName: null,        // 현장 이름
  today: todayStr(),
  tab: "day",            // worker: day | evening
  rec: null,             // 오늘 dayRecord(작업 중)
  photoType: null,       // 낮 화면에서 선택한 사진 종류
  admin: { overview:false, siteName:null, date:null }, // 관리자 드릴다운 상태
};

function todayStr(d){
  d = d||new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function won(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function newDayRecord(site, date){
  return {
    site, date,
    weather: null,
    processes: [],        // [{name, loc}]
    note: "",
    items: [],            // 통합 리스트: {id, kind:"인력"|"장비"|"자재"|"공구", ...필드, amount}
                          //   - 인력            : kind "인력"
                          //   - 반입 장비        : kind "장비"
                          //   - 반입 자재(추후)   : kind "자재", source "반입"
                          //   - 아침 공구        : kind "공구"
                          //   - 새로 산 자재      : kind "자재", source "구입"
    photos: [],           // [{id, type, time, thumb}]  (원본은 IndexedDB)
    signature: null,      // dataURL
    locked: false,
  };
}

// ---------- 진입점 ----------
async function boot(){
  const q = new URLSearchParams(location.search);
  const admin = q.get("admin");
  if(admin && admin === CONFIG.ADMIN_TOKEN){
    APP.mode="admin";
    renderAdmin();
    return;
  }
  const s = q.get("s");
  if(s && CONFIG.SITE_LINKS[s]){
    APP.mode="worker"; APP.siteId=s; APP.siteName=CONFIG.SITE_LINKS[s];
    APP.rec = await Store.loadDay(APP.siteName, APP.today) || newDayRecord(APP.siteName, APP.today);
    APP.photoType = CONFIG.PHOTO_TYPES[0];
    renderWorker();
    return;
  }
  renderInvalid();
}

function renderInvalid(){
  document.getElementById("app").innerHTML = `
    <header class="top"><span>현장 기록</span></header>
    <div class="wrap">
      <div class="card">
        <div class="sec-title">링크가 올바르지 않습니다</div>
        <div class="muted">현장 담당자에게 받은 링크로 다시 열어 주세요.</div>
      </div>
    </div>`;
}

// ================= 작업자 화면 =================
function renderWorker(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="top">
      <span>${esc(APP.siteName)}</span>
      <span class="date">${APP.today}</span>
    </header>
    <div class="wrap" id="screen"></div>
    <div class="tabbar">
      <button id="tab-day" class="${APP.tab==='day'?'on':''}">🌅 오전</button>
      <button id="tab-eve" class="${APP.tab==='evening'?'on':''}">🌆 오후</button>
    </div>`;
  app.querySelector("#tab-day").onclick=()=>{ APP.tab="day"; renderWorker(); };
  app.querySelector("#tab-eve").onclick=()=>{ APP.tab="evening"; renderWorker(); };
  if(APP.tab==="day") renderDay();
  else renderEvening();
}

// ---------- 낮 화면 ----------
async function renderDay(){
  const s = document.getElementById("screen");
  s.innerHTML = "";
  const locked = APP.rec.locked;

  if(locked){
    s.appendChild(el(`<div class="locked-note">🔒 오늘 기록이 서명 완료되어 잠겨 있습니다. [🌆 오후]에서 수정할 수 있습니다.</div>`));
  }

  // 사진 종류 선택 (찍기 전에)
  const typeCard = el(`<div class="card">
    <div class="sec-title">1. 사진 종류를 고르세요</div>
    <div class="grid4" id="ptypes"></div>
  </div>`);
  CONFIG.PHOTO_TYPES.forEach(t=>{
    const b = el(`<button class="btn ${APP.photoType===t?'sel':'pick'}">${esc(t)}</button>`);
    b.onclick=()=>{ APP.photoType=t; renderDay(); };
    typeCard.querySelector("#ptypes").appendChild(b);
  });
  s.appendChild(typeCard);

  // 사진 찍기 큰 버튼
  const shot = el(`<div class="card">
    <button class="btn brand huge" id="shoot">📷 사진 찍기<br><small style="font-size:16px;font-weight:600">(${esc(APP.photoType||'')})</small></button>
    <input type="file" accept="image/*" capture="environment" id="cam" style="display:none">
    <div class="hint">누르면 바로 저장됩니다. 확인 팝업 없음.</div>
  </div>`);
  s.appendChild(shot);
  const cam = shot.querySelector("#cam");
  shot.querySelector("#shoot").onclick=()=> cam.click();
  cam.onchange = async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value=""; // 같은 사진 다시 찍기 가능
    if(!file) return;
    await handleShot(file);
  };

  // 오늘 찍은 사진 (최신순)
  const listCard = el(`<div class="card">
    <div class="sec-title">오늘 찍은 사진 (${APP.rec.photos.length})</div>
    <div class="thumbs" id="thumbs"></div>
  </div>`);
  const tw = listCard.querySelector("#thumbs");
  if(APP.rec.photos.length===0){
    tw.replaceWith(el(`<div class="muted">아직 없습니다.</div>`));
  }else{
    APP.rec.photos.slice().reverse().forEach(p=>{
      const t = el(`<div class="thumb" style="cursor:pointer">
        <img src="${p.thumb}" alt="">
        <div class="tag"><span>${esc(p.type)}</span><span>${esc(p.time)}</span></div>
      </div>`);
      t.onclick = ()=> openPhotoMenu(p);
      tw.appendChild(t);
    });
    if(!locked) listCard.appendChild(el(`<div class="hint">사진을 누르면 종류 변경·삭제할 수 있습니다.</div>`));
  }
  s.appendChild(listCard);

  // ---- 오늘 공구 / 오늘 자재 (같은 양식) ----
  const toolPresets = await Store.loadTools();
  const matPresets  = await Store.loadMaterials();
  s.appendChild(categoryCard({
    kind:"공구", emoji:"🧰", word:"공구", datalistId:"toollist",
    presets: toolPresets, addPreset: Store.addTool, reloadPresets: Store.loadTools,
  }));
  s.appendChild(categoryCard({
    kind:"자재", emoji:"📦", word:"자재", datalistId:"matlist",
    presets: matPresets, addPreset: Store.addMaterial, reloadPresets: Store.loadMaterials,
  }));
}

// 공구·자재 공용 카드 (가져온 것=버튼 체크+수량, 산·추가한 것=행 입력)
function categoryCard(cfg){
  const locked = APP.rec.locked;
  const K = cfg.kind;
  const card = el(`<div class="card"><div class="sec-title">${cfg.emoji} 오늘 ${cfg.word}</div></div>`);
  // 자동완성용 datalist
  const dl = el(`<datalist id="${cfg.datalistId}"></datalist>`);
  cfg.presets.forEach(n=> dl.appendChild(el(`<option value="${esc(n)}">`)));
  card.appendChild(dl);

  // 1) 가져온 것 — 처음엔 비어 있고, [+ 추가] 누르면 목록에서 고름
  const brought = APP.rec.items.filter(it=>it.kind===K && it.source==="지참");
  if(brought.length){
    const cnt = el(`<div style="margin-bottom:6px"></div>`);
    brought.forEach(it=>{
      const row = el(`<div class="row" style="justify-content:space-between;margin-bottom:8px"></div>`);
      // 이름 — 누르면 수정
      const nameBtn = el(`<button class="btn small ghost" style="width:auto;border:none;font-weight:800;text-align:left;padding:6px 2px">✏️ ${esc(it.name)}</button>`);
      nameBtn.disabled=locked;
      nameBtn.onclick=async ()=>{
        const nv = prompt("이름 수정", it.name);
        if(nv!=null && nv.trim() && nv.trim()!==it.name){
          it.name = nv.trim();
          await cfg.addPreset(it.name);   // 고친 이름도 목록/자동완성에 반영
          await save(); renderDay();
        }
      };
      row.appendChild(nameBtn);
      const box = el(`<div class="row"></div>`);
      const minus = el(`<button class="btn small pick" style="min-width:52px">−</button>`);
      // 개수 — 누르면 직접 입력
      const num   = el(`<button class="btn small pick" style="min-width:48px">${it.count||1}</button>`);
      const plus  = el(`<button class="btn small pick" style="min-width:52px">+</button>`);
      const del   = el(`<button class="btn del" style="margin-left:6px">삭제</button>`);
      [minus,num,plus,del].forEach(x=>x.disabled=locked);
      minus.onclick=async ()=>{ it.count=Math.max(1,(Number(it.count)||1)-1); await save(); renderDay(); };
      plus.onclick =async ()=>{ it.count=(Number(it.count)||1)+1; await save(); renderDay(); };
      num.onclick  =async ()=>{ const v=prompt("개수 입력", it.count||1); if(v!=null){ it.count=Math.max(1,Math.floor(Number(v))||1); await save(); renderDay(); } };
      del.onclick  =async ()=>{ const i=APP.rec.items.indexOf(it); if(i>=0)APP.rec.items.splice(i,1); await save(); renderDay(); };
      box.appendChild(minus); box.appendChild(num); box.appendChild(plus); box.appendChild(del);
      row.appendChild(box);
      cnt.appendChild(row);
    });
    card.appendChild(cnt);
  }else{
    card.appendChild(el(`<div class="muted" style="margin-bottom:8px">아직 없습니다. 아래 [+ ${cfg.word} 고르기]를 누르세요.</div>`));
  }
  if(!locked){
    const pickBtn = el(`<button class="btn brand" style="margin-bottom:4px">+ ${cfg.word} 고르기</button>`);
    pickBtn.onclick = ()=> openPicker(cfg);
    card.appendChild(pickBtn);
  }

  // 2) 산·추가한 것 — 행 입력
  const bought = APP.rec.items.filter(it=>it.kind===K && it.source==="구입");
  if(bought.length){
    card.appendChild(el(`<div style="font-weight:800;margin:14px 0 6px">산·추가한 ${cfg.word}</div>`));
    bought.forEach(it=> card.appendChild(purchasedRow(it, locked, renderDay)));
  }
  if(!locked){
    const addB = el(`<button class="btn ghost" style="margin-top:6px">+ 산·추가한 ${cfg.word}</button>`);
    addB.onclick = async ()=>{
      APP.rec.items.push({ id:uid(), kind:K, source:"구입", name:"", count:1, qty:"", amount:"", vendor:"", place:null, photoId:null, photoThumb:null });
      await save(); renderDay();
    };
    card.appendChild(addB);
  }
  return card;
}

// 가져온 공구·자재 고르기 팝업: 목록에서 찾아 클릭, 없으면 입력 -> 다음부터 자동완성
function openPicker(cfg){
  const K = cfg.kind;
  showModal(`
    <h3>${cfg.word} 고르기</h3>
    <input type="text" id="pk-input" placeholder="찾기 / 없으면 여기에 입력">
    <div class="row" style="margin:8px 0"><button class="btn small brand" id="pk-add" style="width:100%">+ 새로 만들어 추가</button></div>
    <div class="muted" style="margin:6px 0 4px">아래에서 찾아 누르세요 (누르면 추가, 다시 누르면 취소)</div>
    <div id="pk-list" style="max-height:46vh;overflow:auto"></div>
    <div class="row" style="margin-top:12px"><button class="btn small" id="pk-close" style="width:100%">닫기</button></div>
  `, (root, close)=>{
    const input = root.querySelector("#pk-input");
    const listBox = root.querySelector("#pk-list");
    const isAdded = (name)=> APP.rec.items.some(it=>it.kind===K && it.source==="지참" && it.name===name);
    async function toggle(name){
      const i = APP.rec.items.findIndex(it=>it.kind===K && it.source==="지참" && it.name===name);
      if(i>=0) APP.rec.items.splice(i,1);
      else APP.rec.items.push({ id:uid(), kind:K, source:"지참", name, count:1, place:null });
      await save();
    }
    function renderList(){
      const f = (input.value||"").trim();
      listBox.innerHTML="";
      const matches = cfg.presets.filter(n=> !f || n.includes(f));
      matches.forEach(name=>{
        const on = isAdded(name);
        const b = el(`<button class="btn ${on?'sel':'pick'}" style="justify-content:space-between;margin-bottom:8px"><span>${esc(name)}</span><span>${on?'✅':''}</span></button>`);
        b.onclick = async ()=>{ await toggle(name); renderList(); };
        listBox.appendChild(b);
      });
      if(!matches.length){
        listBox.appendChild(el(`<div class="muted">목록에 없습니다. 위 [+ 새로 만들어 추가]를 누르세요.</div>`));
      }
    }
    input.oninput = renderList;
    root.querySelector("#pk-add").onclick = async ()=>{
      const name = input.value.trim();
      if(!name){ input.focus(); return; }
      await cfg.addPreset(name);
      if(cfg.reloadPresets) cfg.presets = await cfg.reloadPresets(); // 새 이름을 목록/자동완성에 반영
      if(!isAdded(name)) await toggle(name);
      input.value="";
      renderList();
    };
    root.querySelector("#pk-close").onclick = ()=>{ close(); renderDay(); };
    renderList();
  });
}

// 산·추가한 공구/자재 한 줄 (kind 로 구분)
function purchasedRow(it, locked, rerender){
  const isTool = it.kind==="공구";
  const listId = isTool ? "toollist" : "matlist";
  const box = el(`<div class="item"></div>`);
  box.appendChild(el(`<div class="head"><span class="kind">산·추가 ${isTool?"공구":"자재"}</span></div>`));
  // 이름
  box.appendChild(el(`<label class="fld">${isTool?"공구":"자재"} 이름</label>`));
  const name = el(`<input type="text" list="${listId}" value="${esc(it.name)}" placeholder="${isTool?"예) 전동드릴":"예) 시멘트"}">`);
  name.disabled=locked;
  name.oninput=(e)=>{ it.name=e.target.value; };
  name.onchange=async (e)=>{ await (isTool?Store.addTool:Store.addMaterial)(e.target.value.trim()); await save(); };
  box.appendChild(name);
  // 수량 (공구=개수 숫자, 자재=자유 입력)
  if(isTool){
    box.appendChild(el(`<label class="fld">개수</label>`));
    const q = el(`<input type="number" inputmode="numeric" value="${Number(it.count)||1}">`);
    q.disabled=locked; q.oninput=(e)=>{ it.count=Number(e.target.value)||1; }; q.onchange=save;
    box.appendChild(q);
  }else{
    box.appendChild(el(`<label class="fld">수량</label>`));
    const q = el(`<input type="text" value="${esc(it.qty||"")}" placeholder="예) 20포">`);
    q.disabled=locked; q.oninput=(e)=>{ it.qty=e.target.value; }; q.onchange=save;
    box.appendChild(q);
  }
  // 금액 (비워도 됨)
  box.appendChild(el(`<label class="fld">금액 (비워도 됩니다)</label>`));
  const amt = el(`<input type="number" inputmode="numeric" value="${it.amount!==""&&it.amount!=null?Number(it.amount):""}" placeholder="구입비">`);
  amt.disabled=locked; amt.oninput=(e)=>{ it.amount = e.target.value===""?"":(Number(e.target.value)||0); }; amt.onchange=save;
  box.appendChild(amt);
  // 구입처 (업체 버튼 + 직접)
  box.appendChild(el(`<label class="fld">구입처 (비워도 됩니다)</label>`));
  const vRow = el(`<div class="row" style="margin-bottom:6px"></div>`);
  CONFIG.COMPANIES.forEach(c=>{
    const b=el(`<button class="btn small ${it.vendor===c?'sel':'pick'}">${esc(c)}</button>`);
    b.disabled=locked;
    b.onclick=async ()=>{ it.vendor=c; await save(); rerender && rerender(); };
    vRow.appendChild(b);
  });
  box.appendChild(vRow);
  const vend = el(`<input type="text" value="${esc(it.vendor||"")}" placeholder="어디서 샀는지">`);
  vend.disabled=locked; vend.oninput=(e)=>{ it.vendor=e.target.value; }; vend.onchange=save;
  box.appendChild(vend);
  // 사진 + 삭제
  attachPhotoAndDelete(box, it, locked, rerender);
  return box;
}

// 사진 누르면 뜨는 메뉴 (종류 변경 / 삭제)
function openPhotoMenu(p){
  const locked = APP.rec.locked;
  if(locked){
    showModal(`<h3>사진</h3><img src="${p.thumb}" style="max-width:100%;border-radius:8px"><div class="muted" style="margin-top:8px">서명 완료되어 잠겨 있습니다.</div><div class="row" style="margin-top:12px"><button class="btn small" id="pm-close">닫기</button></div>`,
      (root,close)=>{ root.querySelector("#pm-close").onclick=close; });
    return;
  }
  showModal(`
    <h3>사진</h3>
    <img src="${p.thumb}" style="max-width:100%;border-radius:8px">
    <label class="fld">종류 바꾸기</label>
    <div class="grid4" id="pm-types"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn small del" id="pm-del">이 사진 삭제</button>
      <button class="btn small" id="pm-close">닫기</button>
    </div>
  `, (root, close)=>{
    const tg = root.querySelector("#pm-types");
    CONFIG.PHOTO_TYPES.forEach(t=>{
      const b = el(`<button class="btn small ${p.type===t?'sel':'pick'}" style="width:100%">${esc(t)}</button>`);
      b.onclick = async ()=>{ p.type = t; await save(); close(); renderDay(); };
      tg.appendChild(b);
    });
    root.querySelector("#pm-del").onclick = async ()=>{
      if(!confirm("이 사진을 삭제할까요?")) return;
      const i = APP.rec.photos.findIndex(x=>x.id===p.id);
      if(i>=0) APP.rec.photos.splice(i,1);
      if(p.id) Store.deletePhoto(p.id);
      await save(); close(); renderDay();
    };
    root.querySelector("#pm-close").onclick = close;
  });
}

// 사진 첨부 + 삭제 (purchasedRow 공용)
function attachPhotoAndDelete(box, it, locked, rerender){
  box.appendChild(el(`<label class="fld">사진 첨부 (선택)</label>`));
  if(it.photoThumb){
    box.appendChild(el(`<img src="${it.photoThumb}" style="height:110px;border-radius:8px;border:1px solid var(--line)">`));
  }
  if(!locked){
    const wrap=el(`<div><button class="btn ghost small" style="width:auto;margin-top:6px">📷 사진 첨부</button><input type="file" accept="image/*" capture="environment" style="display:none"></div>`);
    const inp=wrap.querySelector("input"); const b=wrap.querySelector("button");
    b.onclick=()=>inp.click();
    inp.onchange=async (e)=>{
      const f=e.target.files&&e.target.files[0]; e.target.value="";
      if(!f) return;
      try{
        const {blob, thumb}=await processPhoto(f);
        const id="p_"+uid();
        const ok=await Store.savePhoto(id, blob);
        if(!ok){ alert("저장 공간 부족으로 이 사진은 건너뜁니다."); return; }
        it.photoId=id; it.photoThumb=thumb;
        await save(); rerender && rerender();
      }catch(err){ alert("사진 처리 실패"); }
    };
    box.appendChild(wrap);
  }
  if(!locked){
    const del=el(`<div style="text-align:right;margin-top:10px"><button class="btn del">삭제</button></div>`);
    del.querySelector("button").onclick=async ()=>{
      const i=APP.rec.items.indexOf(it); if(i>=0) APP.rec.items.splice(i,1);
      await save(); rerender && rerender();
    };
    box.appendChild(del);
  }
}

async function handleShot(file){
  const shootBtn = document.getElementById("shoot");
  if(shootBtn){ shootBtn.disabled=true; shootBtn.style.opacity=.6; }
  try{
    let processed;
    try{ processed = await processPhoto(file); }
    catch(err){ alert("사진 처리 실패. 다시 찍어 주세요."); return; }

    const id = "p_"+uid();
    const type = await classifyPhoto(APP.photoType, {blob:processed.blob});
    const time = new Date().toTimeString().slice(0,5);

    // 원본은 IndexedDB — 실패해도 그날 기록 전체가 날아가지 않게 방어
    const okPhoto = await Store.savePhoto(id, processed.blob);
    if(!okPhoto){
      alert("저장 공간이 부족해 이 사진은 건너뜁니다.\n갤러리/캐시를 정리해 주세요.");
      return;
    }
    // 메타(썸네일 포함)만 dayRecord 에 추가
    APP.rec.photos.push({ id, type, time, thumb: processed.thumb });
    const okDay = await Store.saveDay(APP.rec);
    if(!okDay){
      // 텍스트 저장 실패 시 방금 넣은 메타는 되돌림 (기록 정합성 유지)
      APP.rec.photos.pop();
      alert("저장 공간이 부족합니다. 이 사진 기록만 건너뜁니다.");
    }
    renderDay();
  } finally {

function laborRow(it, locked){
  const box = el(`<div class="item"></div>`);

  // 이름
  box.appendChild(el(`<label class="fld">이름</label>`));
  const name = el(`<input type="text" list="namelist" value="${esc(it.name)}" placeholder="이름">`);
  name.disabled=locked;
  name.oninput=(e)=>{ it.name=e.target.value; };
  name.onchange=async (e)=>{ await Store.addName(e.target.value.trim()); await save(); };
  box.appendChild(name);
  // 단가
  box.appendChild(el(`<label class="fld">단가</label>`));
  const wRow=el(`<div class="grid3"></div>`);
  CONFIG.WAGES.forEach(w=>{
    const b=el(`<button class="btn small ${Number(it.wage)===w?'sel':'pick'}" style="width:100%">${won(w)}</button>`);
    b.disabled=locked;
    b.onclick=async ()=>{ it.wage=w; recalc(it); await save(); renderEvening(); };
    wRow.appendChild(b);
  });
  box.appendChild(wRow);
  // 공수
  box.appendChild(el(`<label class="fld">공수</label>`));
  const gRow=el(`<div class="grid3"></div>`);
  CONFIG.GONGSU.forEach(g=>{
    const b=el(`<button class="btn small ${Number(it.gongsu)===g?'sel':'pick'}" style="width:100%">${g}</button>`);
    b.disabled=locked;
    b.onclick=async ()=>{ it.gongsu=g; recalc(it); await save(); renderEvening(); };
    gRow.appendChild(b);
  });
  box.appendChild(gRow);
  // 금액 (손으로 고치면 유지)
  box.appendChild(el(`<label class="fld">금액 (자동계산, 직접 고칠 수 있음)</label>`));
  const amt = el(`<input type="number" inputmode="numeric" value="${Number(it.amount)||0}">`);
  amt.disabled=locked;
  amt.oninput=(e)=>{ it.amount=Number(e.target.value)||0; it.manual=true; };
  amt.onchange=async ()=>{ await save(); const t=document.querySelector(".total"); renderEvening(); };
  box.appendChild(amt);
  // 삭제
  if(!locked){
    const del=el(`<div style="text-align:right;margin-top:10px"><button class="btn del">삭제</button></div>`);
    del.querySelector("button").onclick=async ()=>{
      const i=APP.rec.items.indexOf(it); if(i>=0) APP.rec.items.splice(i,1);
      await save(); renderEvening();
    };
    box.appendChild(del);
  }
  return box;
}
function recalc(it){
  if(!it.manual) it.amount = Math.round((Number(it.wage)||0)*(Number(it.gongsu)||0));
}

function newInItem(type){
  const base = { id:uid(), kind:"장비", equip:type, carNo:"", company:"", driver:"", memo:"", photoId:null, photoThumb:null, amount:"" };
  if(type==="레미콘") return Object.assign(base, {count:"", pourLoc:""});
  if(type==="덤프")   return Object.assign(base, {count:"", direction:""});
  if(type==="포크레인")return Object.assign(base, {timeSlot:""});
  return base; // 기타
}

function inRow(it, vehicles, locked){
  const box = el(`<div class="item"></div>`);
  box.appendChild(el(`<div class="head"><span class="kind">${esc(it.equip||it.kind)}</span></div>`));

  // 차량번호 (필수 아님, 자동완성)

  const car = el(`<input type="text" list="carlist" value="${esc(it.carNo)}" placeholder="비워도 됩니다">`);
  car.disabled=locked;
  car.oninput=(e)=>{ it.carNo=e.target.value; };
  car.onchange=async (e)=>{
    const no=e.target.value.trim();
    if(no && vehicles[no]){ // 고르면 업체/기사 자동 채움
      it.company = vehicles[no].company || it.company;

  box.appendChild(car);

  const fld = (label, key, ph, isCompany)=>{
    box.appendChild(el(`<label class="fld">${esc(label)}</label>`));
    if(isCompany){
      const row=el(`<div class="row" style="margin-bottom:6px"></div>`);
      CONFIG.COMPANIES.forEach(c=>{
        const b=el(`<button class="btn small ${it[key]===c?'sel':'pick'}">${esc(c)}</button>`);
        b.disabled=locked;
        b.onclick=async ()=>{ it[key]=c; await save(); renderEvening(); };
        row.appendChild(b);
      });
      box.appendChild(row);
    }
    const inp=el(`<input type="text" value="${esc(it[key]||"")}" placeholder="${esc(ph||"")}">`);
    inp.disabled=locked;
    inp.oninput=(e)=>{ it[key]=e.target.value; };
    inp.onchange=save;
    box.appendChild(inp);
  };

  if(it.equip==="레미콘"){
    fld("업체","company","", true);
    fld("몇 대","count","예) 5");
    fld("타설위치","pourLoc","예) 지하 1층");
  }else if(it.equip==="덤프"){
    fld("업체","company","", true);
    fld("몇 회","count","예) 3");
    fld("반출/반입","direction","예) 반출");
  }else if(it.equip==="포크레인"){
    fld("기사이름","driver","");
    fld("시간대","timeSlot","예) 오전");
  }else{ // 기타
    fld("내용","memo","자유 입력");
  }

  // 번호판/현장 사진 첨부
  box.appendChild(el(`<label class="fld">사진 첨부 (선택)</label>`));
  if(it.photoThumb){
    box.appendChild(el(`<img src="${it.photoThumb}" style="height:110px;border-radius:8px;border:1px solid var(--line)">`));
  }
  if(!locked){
    const wrap=el(`<div><button class="btn ghost small" style="width:auto;margin-top:6px">📷 사진 첨부</button><input type="file" accept="image/*" capture="environment" style="display:none"></div>`);
    const inp=wrap.querySelector("input"); const b=wrap.querySelector("button");
    b.onclick=()=>inp.click();
    inp.onchange=async (e)=>{
      const f=e.target.files&&e.target.files[0]; e.target.value="";
      if(!f) return;
      try{
        const {blob, thumb}=await processPhoto(f);
        const id="p_"+uid();
        const ok=await Store.savePhoto(id, blob);
        if(!ok){ alert("저장 공간 부족으로 이 사진은 건너뜁니다."); return; }
        it.photoId=id; it.photoThumb=thumb;
        await save(); renderEvening();
      }catch(err){ alert("사진 처리 실패"); }
    };
    box.appendChild(wrap);
  }

  // 삭제
  if(!locked){
    const del=el(`<div style="text-align:right;margin-top:10px"><button class="btn del">삭제</button></div>`);
    del.querySelector("button").onclick=async ()=>{

      await save(); renderEvening();

    box.appendChild(del);
  }
  // 차량번호 입력돼 있으면 업체/기사와 연결 저장
  if(it.carNo){ Store.saveVehicle(it.carNo, it.company, it.driver); }

function showSignPad(){
  showModal(`
    <h3>서명</h3>
    <canvas id="sigpad"></canvas>
    <div class="row" style="margin-top:12px">
      <button class="btn small ghost" id="sig-clear">지우기</button>
      <button class="btn small" id="sig-cancel">취소</button>
      <button class="btn small brand" id="sig-ok">완료</button>
    </div>
  `, (root, close)=>{
    const cv = root.querySelector("#sigpad");
    const ctx = cv.getContext("2d");
    // 캔버스 실제 픽셀 크기 맞추기
    const rect = cv.getBoundingClientRect();
    cv.width = rect.width; cv.height = 220;
    ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#111";
    let drawing=false, has=false;
    const pos=(e)=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
    const down=(e)=>{ e.preventDefault(); drawing=true; has=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
    const move=(e)=>{ if(!drawing)return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
    const up=()=>{ drawing=false; };
    cv.addEventListener("pointerdown",down); cv.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
    root.querySelector("#sig-clear").onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); has=false; };
    root.querySelector("#sig-cancel").onclick=()=> close();
    root.querySelector("#sig-ok").onclick=async ()=>{
      if(!has){ alert("서명을 해 주세요."); return; }
      APP.rec.signature = cv.toDataURL("image/png");
      APP.rec.locked = true;
      const ok = await Store.saveDay(APP.rec);
      if(!ok){ alert("저장 공간 부족으로 저장에 실패했습니다."); APP.rec.locked=false; APP.rec.signature=null; return; }
      close(); renderEvening();
    };
  });
}

function showModal(html, setup){
  const bg = el(`<div class="modal-bg"><div class="modal">${html}</div></div>`);
  document.body.appendChild(bg);
  const close=()=> bg.remove();
  bg.addEventListener("click",(e)=>{ if(e.target===bg) close(); });
  setup && setup(bg.querySelector(".modal"), close);
}

  s.appendChild(ovBtn);

  for(const siteName of Object.values(CONFIG.SITE_LINKS)){
    const rec = await Store.loadDay(siteName, APP.today);
    const items = rec ? rec.items : [];
    const labor = items.filter(i=>i.kind==="인력");
    const equip = items.filter(i=>i.kind==="장비");
    const tools = items.filter(i=>i.kind==="공구");
    const buys  = items.filter(i=>i.kind==="자재" && i.source==="구입");
    const stuff = items.filter(i=>i.kind==="공구" || i.kind==="자재");
    const stuffDone = stuff.filter(i=>i.place).length;
    const total = labor.reduce((a,i)=>a+(Number(i.amount)||0),0);
    const procs = rec && rec.processes.length ? rec.processes.map(p=>p.name).join(", ") : "-";
    const signed = rec && rec.signature;

    const card=el(`<div class="card site-card">
      <div class="row" style="justify-content:space-between">
        <span class="name">${esc(siteName)}</span>
        <span class="badge ${signed?'ok':'no'}">${signed?'사인 됨':'사인 안 됨'}</span>
      </div>
      <div style="margin-top:8px">
        <div class="kv"><span>오늘 공정</span><span>${esc(procs)}</span></div>
        <div class="kv"><span>인원 수</span><span>${labor.length} 명</span></div>
        <div class="kv"><span>장비 수</span><span>${equip.length} 대</span></div>
        <div class="kv"><span>공구</span><span>${tools.length} 종</span></div>
        <div class="kv"><span>새로 산 자재</span><span>${buys.length} 건</span></div>
        <div class="kv"><span>공구·자재 확인</span><span>${stuffDone} / ${stuff.length}</span></div>
        <div class="kv"><span>오늘 합계</span><span>${won(total)} 원</span></div>
      </div>
    </div>`);
    card.onclick=()=>{ APP.admin.siteName=siteName; renderAdmin(); };
    s.appendChild(card);
  }
}

// ---- 전체 보기 (5개 현장 오늘치 합산 + 공구/자재 통합) ----
async function renderAdminOverview(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <header class="top"><span>📊 전체 보기</span><span class="date">${APP.today}</span></header>
    <div class="wrap" id="screen"><div class="muted">불러오는 중…</div></div>`;
  const s=app.querySelector("#screen"); s.innerHTML="";
  const back=el(`<button class="btn ghost" style="margin-bottom:12px">← 현장별 보기</button>`);
  back.onclick=()=>{ APP.admin.overview=false; renderAdmin(); };
  s.appendChild(back);

  // 전 현장 오늘 데이터 수집
  const sites = Object.values(CONFIG.SITE_LINKS);
  let sumWorkers=0, sumLabor=0, sumBuy=0, signedCnt=0, activeCnt=0;
  const toolMap = {};   // 공구명 -> [ {site, count} ]
  const matMap  = {};   // 현장명 -> [ 자재 항목 ]
  for(const site of sites){
    const rec = await Store.loadDay(site, APP.today);
    if(!rec){ continue; }
    activeCnt++;
    const labor = rec.items.filter(i=>i.kind==="인력");
    sumWorkers += labor.length;
    sumLabor   += labor.reduce((a,i)=>a+(Number(i.amount)||0),0);
    sumBuy     += rec.items.filter(i=>i.source==="구입"&&(i.kind==="자재"||i.kind==="공구")).reduce((a,i)=>a+(Number(i.amount)||0),0);
    if(rec.signature) signedCnt++;
    rec.items.filter(i=>i.kind==="공구").forEach(t=>{
      (toolMap[t.name] = toolMap[t.name]||[]).push({site, count:t.count||1, place:t.place});
    });
    const mats = rec.items.filter(i=>i.kind==="자재");
    if(mats.length) matMap[site]=mats;
  }

  // 요약
  s.appendChild(el(`<div class="card">
    <div class="sec-title">오늘 전 현장 요약</div>
    <div class="kv"><span>기록 있는 현장</span><span>${activeCnt} / ${sites.length}</span></div>
    <div class="kv"><span>사인 완료</span><span>${signedCnt} / ${sites.length}</span></div>
    <div class="kv"><span>총 인원</span><span>${sumWorkers} 명</span></div>
    <div class="kv"><span>총 인건비</span><span>${won(sumLabor)} 원</span></div>
    <div class="kv"><span>총 공구·자재 구입비</span><span>${won(sumBuy)} 원</span></div>
  </div>`));

  // 공구 위치 (어느 공구가 오늘 어느 현장에, 창고/차/현장 중 어디에 있나)
  const toolCard = el(`<div class="card"><div class="sec-title">🧰 공구 위치</div></div>`);
  const toolNames = Object.keys(toolMap);
  if(!toolNames.length){ toolCard.appendChild(el(`<div class="muted">오늘 등록된 공구 없음</div>`)); }
  else{
    toolNames.sort().forEach(name=>{
      const where = toolMap[name].map(x=>`${x.site}${x.count>1?"("+x.count+")":""}${x.place?"·"+x.place:"·미확인"}`).join(", ");
      toolCard.appendChild(el(`<div class="kv"><span>${esc(name)}</span><span>${esc(where)}</span></div>`));
    });
  }
  s.appendChild(toolCard);

  // 자재 현황 (현장별 가져온/새로 산 자재 + 저녁 위치)
  const matCard = el(`<div class="card"><div class="sec-title">📦 자재 현황</div></div>`);
  const matSites = Object.keys(matMap);
  if(!matSites.length){ matCard.appendChild(el(`<div class="muted">오늘 등록된 자재 없음</div>`)); }
  else{
    matSites.forEach(site=>{
      matCard.appendChild(el(`<div style="font-weight:800;margin:10px 0 4px">${esc(site)}</div>`));
      matMap[site].forEach(m=>{
        const src = m.source==="구입" ? "새로 산" : "가져온";
        const chk = m.place ? "✅" : "⬜";
        const place = m.place ? m.place : "미확인";
        const q = m.qty || (Number(m.count)>1? m.count+"개":"");
        const label = [m.name||"(이름없음)", q].filter(Boolean).join(" ");
        matCard.appendChild(el(`<div class="kv"><span>${chk} ${esc(label)} <span class="muted" style="font-size:14px">(${src})</span></span><span class="muted">${esc(place)}</span></div>`));
      });
    });
  }
  s.appendChild(matCard);
}

async function renderAdminDates(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <header class="top"><span>${esc(APP.admin.siteName)}</span></header>
    <div class="wrap" id="screen"></div>`;
  const s=app.querySelector("#screen");
  const back=el(`<button class="btn ghost" style="margin-bottom:12px">← 현장 목록</button>`);
  back.onclick=()=>{ APP.admin.siteName=null; renderAdmin(); };
  s.appendChild(back);

  const dates = await Store.listDates(APP.admin.siteName);
  if(!dates.length){ s.appendChild(el(`<div class="card muted">기록이 없습니다.</div>`)); return; }
  for(const d of dates){
    const rec = await Store.loadDay(APP.admin.siteName, d);
    const signed = rec && rec.signature;
    const card=el(`<div class="card site-card">
      <div class="row" style="justify-content:space-between">
        <span class="name" style="font-size:20px">${esc(d)}</span>
        <span class="badge ${signed?'ok':'no'}">${signed?'사인 됨':'사인 안 됨'}</span>
      </div>
      <div class="muted" style="margin-top:6px">${esc(rec&&rec.processes.length?rec.processes.map(p=>p.name).join(", "):"-")}</div>
    </div>`);
    card.onclick=()=>{ APP.admin.date=d; renderAdmin(); };
    s.appendChild(card);
  }
}

async function renderAdminDetail(){
  const app=document.getElementById("app");
  const rec = await Store.loadDay(APP.admin.siteName, APP.admin.date);
  app.innerHTML=`
    <header class="top"><span>${esc(APP.admin.siteName)}</span><span class="date">${esc(APP.admin.date)}</span></header>
    <div class="wrap" id="screen"></div>`;
  const s=app.querySelector("#screen");
  const back=el(`<button class="btn ghost" style="margin-bottom:12px">← 날짜 목록</button>`);
  back.onclick=()=>{ APP.admin.date=null; renderAdmin(); };
  s.appendChild(back);

  if(!rec){ s.appendChild(el(`<div class="card muted">기록 없음</div>`)); return; }

  const labor=rec.items.filter(i=>i.kind==="인력");
  const equip=rec.items.filter(i=>i.kind==="장비"||(i.kind==="자재"&&i.source==="반입"));
  const tools=rec.items.filter(i=>i.kind==="공구");
  const brought=rec.items.filter(i=>i.kind==="자재"&&i.source==="지참");
  const buys =rec.items.filter(i=>i.kind==="자재"&&i.source==="구입");
  const buyTools=rec.items.filter(i=>i.kind==="공구"&&i.source==="구입");
  const stuff=rec.items.filter(i=>i.kind==="공구"||i.kind==="자재");
  const total=labor.reduce((a,i)=>a+(Number(i.amount)||0),0);
  const buyTotal=buys.concat(buyTools).reduce((a,i)=>a+(Number(i.amount)||0),0);
  const stuffDone=stuff.filter(i=>i.place).length;
  const placeStr=(i)=> i.place?`<span class="badge ok">${esc(i.place)}</span>`:`<span class="muted">미확인</span>`;

  // 공정
  s.appendChild(el(`<div class="card">
    <div class="sec-title">공정 · 날씨</div>
    <div class="kv"><span>날씨</span><span>${esc(rec.weather||"-")}</span></div>
    ${rec.processes.map(p=>`<div class="kv"><span>${esc(p.name)}</span><span>${esc(p.loc||"-")}</span></div>`).join("")}
    <div class="kv"><span>특이사항</span><span>${esc(rec.note||"-")}</span></div>
  </div>`));

  // 인력
  s.appendChild(el(`<div class="card">
    <div class="sec-title">인력 (${labor.length}명)</div>
    ${labor.map(i=>`<div class="kv"><span>${esc(i.name||"-")} · ${i.gongsu}공수</span><span>${won(i.amount)} 원</span></div>`).join("") || '<div class="muted">없음</div>'}
    <div class="total">합계 ${won(total)} 원</div>
  </div>`));

  // 반입
  s.appendChild(el(`<div class="card">
    <div class="sec-title">반입 (${equip.length}건)</div>
    ${equip.map(i=>{
      const parts=[i.equip, i.carNo, i.company, i.driver, i.count, i.pourLoc, i.direction, i.timeSlot, i.memo].filter(Boolean);
      return `<div class="kv"><span>${esc(parts.join(" · "))}</span><span>${i.photoThumb?'📷':''}</span></div>`;
    }).join("") || '<div class="muted">없음</div>'}
  </div>`));

  // 공구 (가져온 것 + 산·추가한 것) — 각 물건이 저녁에 어디에 있는지(창고/차/현장)
  s.appendChild(el(`<div class="card">
    <div class="sec-title">🧰 공구 (${tools.length}종)</div>
    ${tools.map(i=>{
      const src=i.source==="구입"?"산":"가져온";
      const money=(i.source==="구입"&&i.amount!==""&&i.amount!=null)?" · "+won(i.amount)+"원":"";
      return `<div class="kv"><span>${esc(i.name||"-")} ${i.count>1?"("+i.count+")":""} ${i.photoThumb?'📷':''}<br><span class="muted" style="font-size:14px">${src}${money}</span></span><span>${placeStr(i)}</span></div>`;
    }).join("") || '<div class="muted">없음</div>'}
  </div>`));

  // 가져온 자재 (아침)
  s.appendChild(el(`<div class="card">
    <div class="sec-title">📦 가져온 자재 (${brought.length}건)</div>
    ${brought.map(i=>{
      const q = i.qty || (Number(i.count)>1? i.count+"개":"");
      const label=[i.name, q].filter(Boolean).join(" · ");
      return `<div class="kv"><span>${esc(label||"-")} ${i.photoThumb?'📷':''}</span><span>${placeStr(i)}</span></div>`;
    }).join("") || '<div class="muted">없음</div>'}
  </div>`));

  // 새로 산 자재
  s.appendChild(el(`<div class="card">
    <div class="sec-title">🛒 새로 산 자재 (${buys.length}건)</div>
    ${buys.map(i=>{
      const label=[i.name, i.qty, i.vendor].filter(Boolean).join(" · ");
      const money=(i.amount!==""&&i.amount!=null)?won(i.amount)+" 원":"";
      return `<div class="kv"><span>${esc(label||"-")} ${i.photoThumb?'📷':''}<br><span class="muted" style="font-size:14px">${money}</span></span><span>${placeStr(i)}</span></div>`;
    }).join("") || '<div class="muted">없음</div>'}
    ${buyTotal>0?`<div class="total">구입비 합계 ${won(buyTotal)} 원</div>`:""}
    ${stuff.length?`<div class="total" style="font-size:18px">저녁 공구·자재 확인 ${stuffDone} / ${stuff.length}</div>`:""}
  </div>`));

  // 사진
  const photoCard=el(`<div class="card"><div class="sec-title">사진 (${rec.photos.length})</div><div class="thumbs"></div></div>`);
  const tw=photoCard.querySelector(".thumbs");
  rec.photos.slice().reverse().forEach(p=>{
    tw.appendChild(el(`<div class="thumb"><img src="${p.thumb}"><div class="tag"><span>${esc(p.type)}</span><span>${esc(p.time)}</span></div></div>`));
  });
  if(!rec.photos.length) tw.replaceWith(el(`<div class="muted">없음</div>`));
  s.appendChild(photoCard);

  // 서명
  s.appendChild(el(`<div class="card">
    <div class="sec-title">서명</div>
    ${rec.signature?`<img src="${rec.signature}" style="max-width:220px;border:1px solid var(--line);border-radius:8px;background:#fff">`:'<div class="badge no">사인 안 됨</div>'}
  </div>`));
}

// ---------- 시작 ----------
boot();
</script>
